server:
  port: 8081

spring:
  application:
    name: servicio-clientes
  datasource:
    url: jdbc:postgresql://localhost:5432/clientes_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  feign:
    pedidos-url: http://localhost:8083

statsig:
  server-secret-key: ${STATSIG_SERVER_SECRET:}

management:
  tracing:
    sampling:
      probability: 1.0
